# Loads GitHub repositories into the hosted database and embeds them.
# Run it by hand from the Actions tab. Needs two repository secrets:
#   DATABASE_URL   connection string of the hosted Postgres (pgvector enabled,
#                  db/migrations applied)
#   EMBED_API_KEY  key for the embedding provider
name: Collect GitHub items

on:
  workflow_dispatch:
    inputs:
      min_stars:
        description: Lowest star count to load
        default: "2000"
      since:
        description: Only repositories pushed on or after this date (YYYY-MM-DD). Empty = all
        default: ""
      embed_limit:
        description: Embed at most this many items (0 = every item without an embedding)
        default: "0"

concurrency: collect-github

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      EMBED_BASE_URL: https://ai.mongodb.com/v1
      EMBED_API_KEY: ${{ secrets.EMBED_API_KEY }}
      EMBED_MODEL: voyage-4
      EMBED_DIM: "1024"
      EMBED_INPUT_TYPE: document
      MIN_STARS: ${{ inputs.min_stars }}
      SINCE: ${{ inputs.since }}
      EMBED_LIMIT: ${{ inputs.embed_limit }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r scripts/requirements.txt
      - name: Collect
        run: python scripts/collect_github.py collect --min-stars "$MIN_STARS" ${SINCE:+--since "$SINCE"}
      - name: Embed
        run: python scripts/collect_github.py embed --batch-size 100 --limit "$EMBED_LIMIT"
